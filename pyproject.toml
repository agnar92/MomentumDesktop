[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["engine"]   # engine/ = niezmieniona kopia watchlist.py i finviz.py z Momentum (patrz engine/README.md)

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "E731"]
