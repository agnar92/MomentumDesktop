<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CEM10</title>
<link rel="stylesheet" href="style.css">
<script>
  // motyw przed pierwszym malowaniem (bez mignięcia): zapis w localStorage, domyślnie jak system
  try { const t = localStorage.getItem("cem10_theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}
</script>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><span class="logo" aria-hidden="true">C</span><div><b>CEM10</b><small>momentum miesięczne</small></div></div>
    <nav id="nav" aria-label="Widoki">
      <button data-view="home"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V20a1 1 0 0 1-1 1h-5v-6h-4v6H5a1 1 0 0 1-1-1z"/></svg><span>Ten miesiąc</span></button>
      <button data-view="pf"><svg viewBox="0 0 24 24"><path d="M4 7h16v12H4zM8 7V5h8v2"/></svg><span>Portfel</span></button>
      <button data-view="usa"><svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16M8 15l3-4 3 2 5-6"/></svg><span>Lista USA</span><em id="navUsa"></em></button>
      <button data-view="gpw"><svg viewBox="0 0 24 24"><path d="M4 19V5m0 14h16M8 16l4-6 3 3 4-5"/></svg><span>Lista GPW</span><em id="navGpw"></em></button>
      <button data-view="hist"><svg viewBox="0 0 24 24"><path d="M12 7v5l3 2M21 12a9 9 0 1 1-9-9 9 9 0 0 1 9 9z"/></svg><span>Historia konta</span></button>
      <button data-view="set"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zm7.4-3a7.4 7.4 0 0 0-.1-1.3l2-1.6-2-3.4-2.4 1a7 7 0 0 0-2.2-1.3L14.4 3h-4l-.4 2.5a7 7 0 0 0-2.2 1.3l-2.4-1-2 3.4 2 1.6a7.4 7.4 0 0 0 0 2.6l-2 1.6 2 3.4 2.4-1a7 7 0 0 0 2.2 1.3l.4 2.5h4l.4-2.5a7 7 0 0 0 2.2-1.3l2.4 1 2-3.4-2-1.6c.1-.4.1-.9.1-1.3z"/></svg><span>Ustawienia</span></button>
    </nav>
    <div class="side-foot">
      <button class="ghost sm" id="themeBtn" type="button" title="Motyw">◐ Motyw: <span id="themeLbl">system</span></button>
      <p class="muted xs">Wynik reguł, nie rekomendacja.</p>
    </div>
  </aside>

  <main>
    <div class="topbar">
      <div class="top-status" id="topStatus"></div>
      <div class="top-actions">
        <label class="btn ghost" title="Raport z xStation: Historia konta → Eksport (zip)">
          <input type="file" id="xtbFile" accept=".zip,.xlsx" hidden>
          <svg viewBox="0 0 24 24"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 20h14"/></svg><span>Raport XTB</span>
        </label>
        <button class="btn primary" id="fetchBtn" type="button"><svg viewBox="0 0 24 24"><path d="M20 12a8 8 0 1 1-2.3-5.7M20 4v5h-5"/></svg><span>Pobierz listę</span></button>
      </div>
      <div class="progress" id="progress" hidden><div class="bar"><i id="progressBar"></i></div><span id="progressTxt"></span></div>
    </div>
    <div id="view" class="view" tabindex="-1"></div>
  </main>
</div>

<div class="drawer" id="drawer" hidden>
  <div class="drawer-bg" data-close></div>
  <section class="drawer-panel" role="dialog" aria-modal="true" aria-labelledby="chTitle">
    <header><div><h2 id="chTitle"></h2><p id="chSub" class="muted"></p></div><button class="icon" data-close aria-label="Zamknij">✕</button></header>
    <div id="chBody" class="chart-body"></div>
    <p class="muted xs legend"><i class="lg sma"></i> SMA 10 z zamknięć <i class="lg buy"></i> cena zakupu <i class="lg stop"></i> stop −40 % · wolumen: zielony wzrost, czerwony spadek, linia = średnia 10 mies. · ostatni słupek = miesiąc w toku</p>
  </section>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="app.js"></script>
</body>
</html>
