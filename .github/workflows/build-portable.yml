name: Build CEM10

# CEM10 jako jeden plik CEM10.exe (Windows, bez instalacji). Dane (Finviz + yfinance) program pobiera sam przyciskiem "Pobierz listę" do folderu data/ obok pliku.
# Gotowy plik: Releases -> "latest" (odnawiane po każdym udanym buildzie z main) albo Actions -> uruchomienie -> Artifacts; tag v* tworzy osobne wydanie.
on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "tests/**", ".github/workflows/tests.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-cem10
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: PyInstaller (jeden plik)
        shell: bash
        run: |
          pyinstaller --noconfirm --onefile --windowed --name CEM10 \
            --collect-submodules yfinance --collect-data yfinance \
            --collect-data certifi --copy-metadata yfinance --collect-all webview \
            --exclude-module tkinter --exclude-module matplotlib --exclude-module IPython --exclude-module pytest \
            --add-data "desktop/cem10_web;desktop/cem10_web" \
            cem10_main.py
      - name: Selftest zbudowanego pliku
        run: dist/CEM10.exe --selftest
      - name: Pakiet (plik + folder data/)
        shell: bash
        run: |
          mkdir -p CEM10/data && touch CEM10/data/.gitkeep
          cp dist/CEM10.exe CEM10.md CEM10/
          7z a -tzip CEM10-Windows.zip CEM10 > /dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: CEM10-Windows
          path: CEM10-Windows.zip
      - name: Publikacja wydania
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
            gh release create "$TAG" CEM10-Windows.zip --title "CEM10 $TAG" --generate-notes
          else
            gh release delete latest --cleanup-tag --yes || true
            gh release create latest CEM10-Windows.zip --target "$GITHUB_SHA" --title "CEM10 (najnowszy build)" \
              --notes "Automatyczny build z gałęzi main (${GITHUB_SHA::7}). Rozpakuj zip i uruchom CEM10.exe: portfel z raportu XTB, plan wpłaty, krzywa kapitału, lista miesięczna USA / GPW. Dane: folder data/ obok programu; przy pierwszym uruchomieniu kliknij ⟳ Pobierz listę."
          fi
