name: Tests

on:
  # Feature branches are tested by pull_request. Restrict push runs to main to avoid duplicate CI per PR update.
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y python3-tk xvfb
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: xvfb-run -a python -m pytest -q
